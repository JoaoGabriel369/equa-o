<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Desafie sua mente resolvendo equações em um quiz de matemática.">
  <title>Equa-o | Desafio de Matemática</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Patrick+Hand:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:light;--ink:#172d3b;--muted:#657681;--blue:#26718b;--green:#267b60;--red:#b94343;--chalk:#f5f4ed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:#101214;background-image:radial-gradient(ellipse at 18% 15%,#303438 0,transparent 34%),radial-gradient(ellipse at 85% 82%,#292d30 0,transparent 35%);color:var(--chalk);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:34px 16px;position:relative;isolation:isolate;overflow-x:hidden}
body:before,body:after{position:fixed;z-index:-1;pointer-events:none;color:#f4f2e9;opacity:.14;font-family:'Patrick Hand',cursive;font-size:clamp(20px,3vw,34px);line-height:2.15;white-space:pre;letter-spacing:2px}
body:before{content:'x² + y² = z²     3 × 3 = 9      f(x) = ax + b\A  √(b² − 4ac)      sin θ + cos θ = 1\A      π ≈ 3,14159       a² + b² = c²\A  y = mx + b       ∫ x dx = x²/2';top:-15px;left:-30px;transform:rotate(-5deg)}
body:after{content:'(a + b)² = a² + 2ab + b²\A       x = (−b ± √Δ) / 2a\A  2x + 5 = 17       sen 30° = 1/2\A      E = mc²       ∑ n = n(n+1)/2';right:-30px;bottom:-20px;transform:rotate(4deg);text-align:right}
button{font:inherit}.app{width:min(100%,690px);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 7px 22px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.8px;color:#fff}
.brand-mark{width:42px;height:42px;border:2px solid #f5f4ed;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:700;transform:rotate(-8deg);text-shadow:0 0 8px #fff8}
.tag{font-family:'Patrick Hand',cursive;font-size:17px;color:#f5f4ed;border:1px dashed #f5f4ed88;padding:5px 12px;border-radius:3px;transform:rotate(1deg)}
.card{position:relative;background-color:#fbfaf4;background-image:linear-gradient(rgba(73,139,164,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(73,139,164,.17) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);padding:clamp(27px,5vw,45px);border:0;border-radius:0;clip-path:polygon(1% 1%,5% .5%,10% 1%,16% .4%,22% 1%,29% .5%,36% 1%,43% .4%,50% 1%,57% .5%,64% 1%,71% .4%,78% 1%,85% .5%,92% 1%,99% .5%,99.5% 10%,99% 20%,99.7% 30%,99% 40%,99.6% 50%,99% 60%,99.7% 70%,99% 80%,99.5% 90%,99% 99%,92% 99.5%,85% 99%,78% 99.6%,71% 99%,64% 99.5%,57% 99%,50% 99.6%,43% 99%,36% 99.5%,29% 99%,22% 99.6%,15% 99%,8% 99.5%,1% 99%,.5% 90%,1% 80%,.4% 70%,1% 60%,.4% 50%,1% 40%,.4% 30%,1% 20%,.5% 10%);filter:drop-shadow(0 14px 22px #0009)}
.stats{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:25px}
.stat-label{font-family:'Patrick Hand',cursive;font-size:17px;color:var(--muted);font-weight:700}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;margin-top:1px;color:var(--ink)}
.stat:last-child{text-align:right}.progress-wrap{height:8px;background:#d9e2e3;overflow:hidden;margin-top:8px;border:1px solid #c4d1d4}
.progress{height:100%;width:0;background:repeating-linear-gradient(135deg,#26718b,#26718b 7px,#438da4 7px,#438da4 14px);transition:width .35s ease}
.level{text-align:center;color:var(--blue);font-family:'Patrick Hand',cursive;font-size:18px;font-weight:700}
.prompt{text-align:center;margin:29px 0 27px}.prompt p{margin:0 0 13px;color:var(--muted);font-family:'Patrick Hand',cursive;font-size:21px}
.equation{font-family:'Space Grotesk',sans-serif;font-size:clamp(42px,9vw,66px);font-weight:700;letter-spacing:-2px;line-height:1.2;overflow-wrap:anywhere;color:#172d3b}.equation .equals{color:var(--blue)}
.hint{min-height:22px;text-align:center;font-family:'Patrick Hand',cursive;font-size:17px;color:#71828a;margin-top:11px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.answer{min-height:66px;border:2px solid #b8c9cd;border-radius:3px;background:rgba(255,255,255,.62);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;box-shadow:2px 3px 0 #17384a12}
.answer:hover:not(:disabled){transform:translateY(-3px);border-color:var(--blue);background:#e8f3f5}
.answer:focus-visible,.primary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.answer.correct{background:#e0f1e8;border-color:var(--green);color:var(--green)}.answer.wrong{background:#f8e7e5;border-color:var(--red);color:var(--red);animation:shake .25s}
.answer:disabled{cursor:default}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.feedback{min-height:26px;text-align:center;margin:17px 0 0;font-family:'Patrick Hand',cursive;font-size:19px;font-weight:700;color:var(--ink)}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;color:#687982;font-family:'Patrick Hand',cursive;font-size:16px;gap:10px}
.keyboard{border:1px solid #aebfc3;padding:2px 7px;border-radius:2px;color:#365766;font-family:'DM Sans',sans-serif;font-size:11px;background:#fff9}
.primary{border:0;border-radius:3px;background:var(--blue);color:white;padding:13px 22px;font-weight:800;cursor:pointer;transition:transform .15s,background .15s;box-shadow:3px 4px 0 #143d4c30}
.primary:hover{background:#1c566d;transform:translateY(-1px)}
.result{text-align:center;padding:22px 0 8px}.result-icon{width:76px;height:76px;border:2px dashed var(--blue);color:var(--blue);display:grid;place-items:center;font-size:36px;margin:0 auto 20px;border-radius:50%;background:#eaf3f4}
.result h1{font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0 0 8px;color:var(--ink)}.result p{color:var(--muted);line-height:1.6;margin:0 auto 22px;max-width:390px}
.final-score{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;color:var(--blue);margin:8px 0}.hidden{display:none}
@media(max-width:480px){body{padding:22px 10px}.top{margin:0 5px 17px}.brand{font-size:22px}.tag{font-size:14px}.card{padding:27px 19px}.stats{margin-bottom:20px}.answer{min-height:59px}.footer{font-size:14px}.footer .tip{max-width:160px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-mark">∑</span><span>equa-o</span></div>
      <span class="tag">DESAFIO DE MATEMÁTICA</span>
    </header>

    <section class="card" aria-live="polite">
      <div id="game">
        <div class="stats">
          <div class="stat"><div class="stat-label">Questão</div><div class="stat-value"><span id="current">1</span><span style="color:var(--muted)"> / 15</span></div><div class="progress-wrap"><div class="progress" id="progress"></div></div></div>
          <div class="level" id="level">Nível 1</div>
          <div class="stat"><div class="stat-label">Pontos</div><div class="stat-value"><span id="score">0</span> <span style="font-size:14px;color:var(--yellow)">★</span></div></div>
        </div>
        <div class="prompt">
          <p id="questionPrompt">Resolva o desafio matemático:</p>
          <div class="equation" id="equation">8 + 4 <span class="equals">= ?</span></div>
          <div class="hint" id="hint">Escolha uma das quatro alternativas</div>
        </div>
        <div class="answers" id="answers">
          <button class="answer" type="button">12</button><button class="answer" type="button">10</button><button class="answer" type="button">14</button><button class="answer" type="button">16</button>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="footer"><span class="tip">💡 Acerte para avançar à próxima questão</span><span><span class="keyboard">1–4</span> selecionar</span></div>
      </div>
      <div class="result hidden" id="result">
        <div class="result-icon">🏆</div>
        <h1>Desafio concluído!</h1>
        <p id="result-message">Você terminou as 10 questões.</p>
        <div class="final-score" id="final-score">0/10</div>
        <p>Respostas corretas</p>
        <button class="primary" id="restart" type="button">Jogar novamente ↻</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const TOTAL = 15;
      let question = 0, score = 0, currentAnswer = 0, locked = false;
      const $ = id => document.getElementById(id);
      const equationEl = $('equation'), answersEl = $('answers');
      const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
      const shuffle = arr => arr.sort(() => Math.random()-.5);
      const money = n => 'R$ ' + n.toLocaleString('pt-BR');

      function makeQuestion(index) {
        const level = Math.min(5, Math.floor(index / 3) + 1);
        let a,b,c,answer,expression,prompt,explanation;
        switch(index) {
          case 0:
          case 1:
          case 2:
            a=rand(12,45); b=rand(4,25);
            if(index===0){answer=a+b;expression=`${a} + ${b}`;explanation=`${a} + ${b} = ${answer}.`;}
            else if(index===1){answer=a-b;expression=`${a} − ${b}`;explanation=`${a} − ${b} = ${answer}.`;}
            else {a=rand(3,12);b=rand(3,9);answer=a*b;expression=`${a} × ${b}`;explanation=`${a} × ${b} = ${answer}.`;}
            prompt='Resolva a operação e encontre o resultado:';
            break;
          case 3:
          case 4:
          case 5:
            if(index===3){a=rand(3,12);b=rand(2,10);c=rand(1,15);answer=a*b+c;expression=`${a} × ${b} + ${c}`;explanation=`Primeiro, ${a} × ${b} = ${a*b}; depois, somamos ${c} e obtemos ${answer}.`;}
            else if(index===4){b=rand(3,12);answer=rand(3,12);a=b*answer;expression=`${a} ÷ ${b}`;explanation=`${a} dividido por ${b} é igual a ${answer}.`;}
            else {a=rand(2,8);b=rand(2,8);c=rand(2,6);answer=(a+b)*c;expression=`(${a} + ${b}) × ${c}`;explanation=`Resolva os parênteses: ${a+b} × ${c} = ${answer}.`;}
            prompt='Aplique a ordem correta das operações:';
            break;
          case 6:
          case 7:
          case 8:
            if(index===6){a=rand(10,30)*5; b=rand(10,40);answer=a*b/100;expression=`${b}% de ${a}`;explanation=`${b}/100 × ${a} = ${answer}.`;prompt='Uma loja oferece um desconto percentual. Qual é o valor correspondente a essa porcentagem?';}
            else if(index===7){a=rand(2,8);b=rand(2,9);answer=a*b;expression=`x = ${a} × ${b}`;explanation=`Multiplicando ${a} por ${b}, encontramos x = ${answer}.`;prompt='Uma grandeza varia proporcionalmente. Determine o valor de x:';}
            else {a=rand(2,9);b=rand(1,15);c=rand(2,8);answer=a*c+b;expression=`f(${c}) = ${a} · ${c} + ${b}`;explanation=`Substituindo x por ${c}: ${a} × ${c} + ${b} = ${answer}.`;prompt='Considere a função definida por f(x) = ' + a + 'x + ' + b + '. Qual é o valor de f(' + c + ')?';}
            break;
          case 9:
          case 10:
          case 11:
            if(index===9){a=rand(4,12);b=rand(5,15);answer=a*b;expression=`A = ${a} × ${b}`;explanation=`A área do retângulo é base × altura: ${a} × ${b} = ${answer} unidades².`;prompt='Uma sala retangular mede ' + a + ' m de comprimento e ' + b + ' m de largura. Qual é sua área?';}
            else if(index===10){a=rand(3,9)*10;b=rand(2,5);answer=a*b;expression=`d = ${a} × ${b}`;explanation=`Distância = velocidade × tempo = ${a} × ${b} = ${answer} km.`;prompt='Um veículo mantém velocidade média de ' + a + ' km/h durante ' + b + ' horas. Quantos quilômetros percorre?';}
            else {a=rand(4,10)*2;b=rand(10,30);c=rand(10,30);answer=(a+b+c)/3;expression=`M = (${a} + ${b} + ${c}) ÷ 3`;explanation=`A média é a soma dos valores dividida por 3: ${a+b+c} ÷ 3 = ${answer}.`;prompt='As notas de um estudante foram ' + a + ', ' + b + ' e ' + c + '. Qual foi a média aritmética?';}
            break;
          case 12:
          case 13:
          default:
            if(index===12){a=rand(2,5)*10;b=rand(10,30);answer=a*(100-b)/100;expression=`Preço final = ${money(a)} − ${b}%`;explanation=`O desconto é ${b}% de ${a}, ou ${a*b/100}. Assim, o preço final é ${answer}.`;prompt='Em uma promoção, um produto de ' + money(a) + ' recebe desconto de ' + b + '%. Qual é o preço final?';}
            else if(index===13){a=rand(3,8);b=rand(2,6);c=rand(5,20);answer=a*b+c;expression=`C = ${c} + ${a} × ${b}`;explanation=`A tarifa fixa é ${c} e a parte variável é ${a} × ${b} = ${a*b}. Total: ${answer}.`;prompt='Um serviço cobra taxa fixa de ' + money(c) + ' mais ' + money(a) + ' por unidade. Para ' + b + ' unidades, qual é o custo total?';}
            else {a=rand(3,8);b=rand(2,6);c=rand(2,5);answer=a*b*c;expression=`V = ${a} × ${b} × ${c}`;explanation=`O volume é comprimento × largura × altura: ${a} × ${b} × ${c} = ${answer} unidades³.`;prompt='Uma caixa tem ' + a + ' cm de comprimento, ' + b + ' cm de largura e ' + c + ' cm de altura. Qual é seu volume?';}
            break;
        }
        const levelNames=['Fundamentos','Operações','Álgebra e porcentagem','Problemas aplicados','Interpretação ENEM'];
        return {expression,answer,level,prompt,explanation,levelName:levelNames[level-1]};
      }

      function makeChoices(answer) {
        const choices = new Set([answer]);
        const base = Math.max(3, Math.round(Math.abs(answer) * 0.12));
        let attempts = 0;
        while(choices.size < 4 && attempts < 100) {
          attempts++;
          const offset = rand(1,base+5);
          const candidate = answer + (Math.random()<.5?-offset:offset);
          if(candidate >= 0 && candidate !== answer) choices.add(candidate);
        }
        let fallback=1;
        while(choices.size<4){if(!choices.has(answer+fallback))choices.add(answer+fallback);fallback++;}
        return shuffle([...choices]);
      }

      function renderQuestion() {
        locked=false;
        const q=makeQuestion(question); currentAnswer=q.answer;
        $('current').textContent=question+1;
        $('score').textContent=score;
        $('level').textContent='Nível '+q.level+' · '+q.levelName;
        $('progress').style.width=(question/TOTAL*100)+'%';
        $('questionPrompt').textContent=q.prompt;
        equationEl.textContent=q.expression+' = ?';
        $('hint').textContent='Escolha a alternativa correta';
        $('feedback').textContent=''; $('feedback').className='feedback';
        answersEl.innerHTML='';
        makeChoices(q.answer).forEach((value,i)=>{
          const btn=document.createElement('button');
          btn.type='button';btn.className='answer';btn.textContent=Number.isInteger(value)?value:value.toLocaleString('pt-BR');
          btn.setAttribute('aria-label','Alternativa '+(i+1)+': '+value);
          btn.addEventListener('click',()=>choose(value,btn,q));
          answersEl.appendChild(btn);
        });
      }

      function choose(value,button,q) {
        if(locked)return;
        if(value===currentAnswer) {
          locked=true;score++;button.classList.add('correct');
          $('feedback').textContent='✓ Correto! '+q.explanation;
          $('feedback').className='feedback good';
          $('score').textContent=score;
          [...answersEl.children].forEach(b=>b.disabled=true);
          window.setTimeout(()=>{question++;if(question>=TOTAL)finish();else renderQuestion();},1500);
        } else {
          button.classList.add('wrong');button.disabled=true;
          $('feedback').textContent='Ainda não! Analise as alternativas restantes.';
          $('feedback').className='feedback bad';
        }
      }

      function finish() {
        $('game').classList.add('hidden');$('result').classList.remove('hidden');
        $('progress').style.width='100%';
        $('final-score').textContent=score+'/'+TOTAL;
        $('result-message').textContent=score===TOTAL?'Excelente! Você dominou todos os níveis, inclusive os desafios inspirados no ENEM.':score>=12?'Ótimo desempenho! Você chegou aos desafios de nível ENEM.':score>=8?'Bom trabalho! Continue praticando interpretação e resolução de problemas.':'Não desanime! Revise as explicações e tente novamente para avançar nos níveis.';
      }

      $('restart').addEventListener('click',()=>{question=0;score=0;$('result').classList.add('hidden');$('game').classList.remove('hidden');renderQuestion();});
      document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&!locked&&!$('game').classList.contains('hidden')){const btn=answersEl.children[Number(e.key)-1];if(btn&&!btn.disabled)btn.click();}});
      renderQuestion();
    })();
  </script>
</body>
</html>
